# Spring での利用例（com.prism7.testtoolbelt.spring）の設定
spring.datasource.url=${dbjigu.url:jdbc:postgresql://192.168.64.2:5432/postgres}
spring.datasource.username=${dbjigu.user:postgres}
spring.datasource.password=${dbjigu.password:postgres}
# テーブルはテストのトランザクション内で @Sql により作成し、終了時にロールバックする
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
