name: build

# プルリクエストではマージ前に確認し、main へのプッシュ（マージ）では結果を確認する
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # 利用先の最低バージョンである Java 17 で実行する
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build -Pdbjigu.url=jdbc:postgresql://localhost:5432/postgres

  # フィクスチャエディタ（tools/fixture-editor.html）のテスト。ランナーにある Node と Chrome を使う
  fixture-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test tools/test/*.test.js
